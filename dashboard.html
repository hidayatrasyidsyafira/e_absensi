<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Absensi QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </div>
      <span class="font-semibold text-gray-900">Absensi QR</span>
    </div>
    <button onclick="Auth.logout()"
      class="text-sm text-gray-600 hover:text-red-600 font-medium">
      Keluar
    </button>
  </nav>

  <!-- Content -->
  <main class="max-w-4xl mx-auto p-6">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 text-center">
      <h1 class="text-2xl font-semibold text-gray-900 mb-2" id="greeting">Memuat...</h1>
      <p class="text-gray-500 mb-6" id="roleInfo">-</p>

      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-8 text-left">
        <div class="bg-gray-50 rounded-xl p-4">
          <p class="text-xs text-gray-500 mb-1">User ID</p>
          <p class="font-mono text-sm text-gray-900" id="userId">-</p>
        </div>
        <div class="bg-gray-50 rounded-xl p-4">
          <p class="text-xs text-gray-500 mb-1">Role</p>
          <p class="font-medium text-sm text-gray-900 capitalize" id="userRole">-</p>
        </div>
        <div class="bg-gray-50 rounded-xl p-4">
          <p class="text-xs text-gray-500 mb-1">Status</p>
          <p class="font-medium text-sm text-green-600">Aktif</p>
        </div>
      </div>

      <div class="mt-8 pt-6 border-t border-gray-100">
        <p class="text-sm text-gray-400">
          🚧 Fitur absen, rekap, dan dashboard admin akan ditambahkan di fase berikutnya.
        </p>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script>
    // Proteksi halaman
    (async () => {
      if (!Auth.isLoggedIn()) {
        window.location.href = 'index.html';
        return;
      }
      const valid = await Auth.validateToken();
      if (!valid) {
        window.location.href = 'index.html';
        return;
      }

      const user = Auth.getUser();
      if (user) {
        document.getElementById('greeting').textContent = `Halo, ${user.nama} 👋`;
        document.getElementById('roleInfo').textContent = `Anda masuk sebagai ${user.role}`;
        document.getElementById('userId').textContent = user.id;
        document.getElementById('userRole').textContent = user.role;
      }
    })();
  </script>
</body>
</html>
