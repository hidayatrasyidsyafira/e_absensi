<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengaturan Sistem — Absensi QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-10">

 <nav class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <span class="font-semibold text-gray-900 text-lg">Pengaturan Sistem</span>
    </div>
    <div class="text-sm text-gray-500 font-medium" id="headerTanggalSetting">-</div>
  </nav>

  <main class="max-w-xl mx-auto p-4 mt-4">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <h1 class="text-xl font-bold text-gray-800 mb-6 border-b pb-3">Konfigurasi Absensi</h1>
      
      <form id="formSettings" class="space-y-5">
        <!-- Jam Masuk & Pulang -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Jam Masuk</label>
            <input type="time" id="jam_masuk" class="w-full px-3 py-2 border rounded-lg" required>
            <p class="text-[10px] text-gray-500 mt-1">Batas waktu scan gerbang pagi.</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Jam Pulang</label>
            <input type="time" id="jam_pulang" class="w-full px-3 py-2 border rounded-lg" required>
            <p class="text-[10px] text-gray-500 mt-1">Batas pergantian mode di scanner.</p>
          </div>
        </div>

        <!-- Toleransi -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Toleransi Keterlambatan (Menit)</label>
          <input type="number" id="toleransi_menit" class="w-full px-3 py-2 border rounded-lg" required>
          <p class="text-[10px] text-gray-500 mt-1">Contoh: 15. Jika masuk jam 07:00, siswa masih dianggap "Tepat" sampai 07:15.</p>
        </div>

        <hr class="border-gray-200">

        <!-- GPS (Opsional) -->
        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
          <h3 class="text-sm font-bold text-gray-800 mb-3 flex items-center gap-2">
            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            Pengaturan GPS (Opsional)
          </h3>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Koordinat Sekolah</label>
              <input type="text" id="lokasi_kantor" class="w-full px-3 py-2 border rounded-lg" placeholder="Contoh: -6.200000,106.816666">
              <p class="text-[10px] text-gray-500 mt-1">Buka Google Maps, klik kanan di gerbang sekolah, copy koordinatnya.</p>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Radius (Meter)</label>
              <input type="number" id="radius_meter" class="w-full px-3 py-2 border rounded-lg" placeholder="Contoh: 100">
            </div>
          </div>
        </div>

        <div class="pt-4 border-t mt-6">
          <button type="submit" id="btnSimpan" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors shadow-sm">
            Simpan Pengaturan
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const user = Auth.getUser();
      if (!user || user.role !== 'admin') {
        alert('Halaman ini hanya untuk Admin.');
        window.location.href = 'dashboard.html';
        return;
      }
      loadSettings();
      document.getElementById('headerTanggalSetting').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    });

    async function loadSettings() {
      const res = await API.post('getSettingsAdmin', { token: Auth.getToken() });
      if (!res.success) return alert('Gagal memuat setting: ' + res.message);

      const s = res.data;
      document.getElementById('jam_masuk').value = s['jam_masuk'] || '07:00';
      document.getElementById('jam_pulang').value = s['jam_pulang'] || '14:00';
      document.getElementById('toleransi_menit').value = s['toleransi_menit'] || '15';
      document.getElementById('lokasi_kantor').value = s['lokasi_kantor'] || '';
      document.getElementById('radius_meter').value = s['radius_meter'] || '100';
    }

    document.getElementById('formSettings').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSimpan');
      btn.disabled = true; btn.textContent = 'Menyimpan...';

      const data = {
        jam_masuk: document.getElementById('jam_masuk').value,
        jam_pulang: document.getElementById('jam_pulang').value,
        toleransi_menit: document.getElementById('toleransi_menit').value,
        lokasi_kantor: document.getElementById('lokasi_kantor').value,
        radius_meter: document.getElementById('radius_meter').value
      };

      const res = await API.post('updateSettings', { token: Auth.getToken(), data });

      if (res.success) {
        alert(res.message);
      } else {
        alert('Gagal: ' + res.message);
      }
      btn.disabled = false; btn.textContent = 'Simpan Pengaturan';
    });
  </script>
</body>
</html>
