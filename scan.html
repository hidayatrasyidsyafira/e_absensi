<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Gerbang — Absensi QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    #reader { border: none !important; }
    #reader video { border-radius: 1rem; object-fit: cover; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-4">
      <h1 class="text-xl font-bold text-white">Scanner Gerbang</h1>
      <p class="text-sm text-gray-400">Tempelkan Kartu Pelajar ke Kamera</p>
    </div>

    <!-- Area Kamera & Hasil Scan -->
    <div class="relative bg-black rounded-2xl overflow-hidden shadow-2xl aspect-square flex items-center justify-center border-4 border-gray-700" id="cameraContainer">
      <div id="reader" class="w-full"></div>
      
      <!-- Overlay Loading / Hasil -->
      <div id="resultOverlay" class="absolute inset-0 bg-black/90 z-10 hidden flex-col items-center justify-center text-center p-6 transition-all duration-300">
        <div id="resultIcon" class="text-6xl mb-4">⏳</div>
        <h2 id="resultName" class="text-3xl font-bold mb-2">Memproses...</h2>
        <p id="resultKelas" class="text-lg text-gray-300 mb-6"></p>
        <div id="resultStatus" class="px-4 py-2 rounded-full font-bold text-sm"></div>
      </div>
    </div>

    <!-- Indikator Waktu -->
    <div id="indikatorWaktu" class="mt-6 text-center bg-gray-800 py-3 rounded-xl border border-gray-700">
      <p class="text-sm text-gray-400">Memuat konfigurasi waktu...</p>
    </div>

    <!-- Kontrol Tipe Absen (Akan otomatis terkunci) -->
    <div class="mt-4 bg-gray-800 p-2 rounded-xl flex gap-2">
      <button onclick="setTipe('masuk')" id="btnMasuk" class="flex-1 py-3 rounded-lg font-semibold transition-all">
        Absen Masuk
      </button>
      <button onclick="setTipe('pulang')" id="btnPulang" class="flex-1 py-3 rounded-lg font-semibold transition-all">
        Absen Pulang
      </button>
    </div>

    <div class="mt-4 text-center">
      <a href="dashboard.html" class="text-sm text-gray-500 hover:text-white underline">Kembali ke Dashboard</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  
  <script>
    let currentTipe = 'masuk';
    let isScanning = false;
    let html5QrCode;

    // Load Setting Waktu & Otomatis Pilih Mode
        async function initWaktu() {
      try {
        const res = await API.get('getSettings');
        if (res.success) {
          const s = res.data;
          let jamPulang = s['jam_pulang'] || '15:00';
          
          // --- PENGAMAN FORMAT WAKTU ---
          // Jika backend masih mengirim format Date (ISO) atau format aneh
          if (String(jamPulang).includes('T')) {
             const d = new Date(jamPulang);
             jamPulang = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
          } else if (typeof jamPulang === 'string') {
             // Jika tertulis 7:00, jadikan 07:00
             const parts = jamPulang.split(':');
             if(parts.length >= 2) jamPulang = parts[0].padStart(2, '0') + ':' + parts[1].padStart(2, '0');
          }
          // ------------------------------

          const [hP, mP] = jamPulang.split(':').map(Number);
          const batasTransisi = (hP * 60) + mP - 60; // 1 jam sebelum pulang

          const now = new Date();
          const currentMenit = now.getHours() * 60 + now.getMinutes();
          
          const infoEl = document.getElementById('indikatorWaktu');
          const btnMasuk = document.getElementById('btnMasuk');
          const btnPulang = document.getElementById('btnPulang');

          console.log("Cek Waktu -> Sekarang:", currentMenit, "Menit | Batas Transisi:", batasTransisi, "Menit");

          if (currentMenit >= batasTransisi) {
            // Waktunya Pulang
            setTipe('pulang');
            btnMasuk.disabled = true;
            btnMasuk.innerHTML = 'Terkunci (Waktu Pulang)';
            btnPulang.innerHTML = 'Absen Pulang (Aktif)';
            infoEl.innerHTML = `<p class="text-sm text-gray-400">Sekarang: <b class="text-white">${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}</b> | Mode: <b class="text-blue-400">PULANG</b></p>`;
          } else {
            // Waktunya Masuk
            setTipe('masuk');
            btnPulang.disabled = true;
            btnPulang.innerHTML = 'Terkunci (Waktu Masuk)';
            btnMasuk.innerHTML = 'Absen Masuk (Aktif)';
            infoEl.innerHTML = `<p class="text-sm text-gray-400">Sekarang: <b class="text-white">${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}</b> | Mode: <b class="text-green-400">MASUK</b></p>`;
          }
        }
      } catch(e) {
        console.error("Gagal memuat setting waktu", e);
      }
    }

    function setTipe(tipe) {
      currentTipe = tipe;
      const btnMasuk = document.getElementById('btnMasuk');
      const btnPulang = document.getElementById('btnPulang');

      if (tipe === 'masuk') {
        btnMasuk.className = 'flex-1 py-3 rounded-lg font-semibold bg-blue-600 text-white transition-all shadow-md';
        if (!btnPulang.disabled) btnPulang.className = 'flex-1 py-3 rounded-lg font-semibold text-gray-400 hover:bg-gray-700 transition-all';
      } else {
        btnPulang.className = 'flex-1 py-3 rounded-lg font-semibold bg-blue-600 text-white transition-all shadow-md';
        if (!btnMasuk.disabled) btnMasuk.className = 'flex-1 py-3 rounded-lg font-semibold text-gray-400 hover:bg-gray-700 transition-all';
      }
    }

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).catch(err => {
        alert("Gagal mengakses kamera: " + err);
      });
    }

    async function onScanSuccess(decodedText) {
      if (isScanning) return;
      isScanning = true;

      if (navigator.vibrate) navigator.vibrate(200);

      const overlay = document.getElementById('resultOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      document.getElementById('resultIcon').textContent = '⏳';
      document.getElementById('resultName').textContent = 'Memproses...';
      document.getElementById('resultKelas').textContent = decodedText;
      document.getElementById('resultStatus').className = 'hidden';

      const res = await API.post('absenGerbang', { nisn: decodedText, tipe: currentTipe });
      
      if (res.success) {
        document.getElementById('resultIcon').textContent = res.data.status === 'terlambat' ? '⚠️' : '✅';
        document.getElementById('resultName').textContent = res.data.nama;
        document.getElementById('resultKelas').textContent = res.data.kelas;
        
        const statEl = document.getElementById('resultStatus');
        statEl.classList.remove('hidden');
        if (res.data.status === 'tepat') {
          statEl.textContent = `Masuk Tepat Waktu - ${res.data.jam}`;
          statEl.className = 'px-4 py-2 rounded-full font-bold text-sm bg-green-500/20 text-green-400 border border-green-500/50';
        } else {
          statEl.textContent = `Terlambat - ${res.data.jam}`;
          statEl.className = 'px-4 py-2 rounded-full font-bold text-sm bg-yellow-500/20 text-yellow-400 border border-yellow-500/50';
        }
      } else {
        document.getElementById('resultIcon').textContent = '❌';
        document.getElementById('resultName').textContent = 'Gagal';
        
        const statEl = document.getElementById('resultStatus');
        statEl.classList.remove('hidden');
        statEl.textContent = res.message;
        statEl.className = 'px-4 py-2 rounded-full font-bold text-sm bg-red-500/20 text-red-400 border border-red-500/50';
      }

      setTimeout(() => {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        isScanning = false;
      }, 3000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initWaktu(); // Cek jam dulu sebelum mulai
      startScanner();
    });
  </script>
</body>
</html>
