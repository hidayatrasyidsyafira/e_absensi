<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export Absensi — Absensi QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-10">

  <nav class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <span class="font-semibold text-gray-900 text-lg">Export Data Absensi</span>
    </div>
    <div class="text-sm text-gray-500 font-medium" id="headerTanggalExport">-</div>
  </nav>

  <main class="max-w-xl mx-auto p-4 mt-8">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-4">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Unduh Laporan Absensi</h1>
        <p class="text-sm text-gray-500 mt-2">Pilih rentang tanggal dan jenis absensi, lalu unduh dalam format Excel (CSV).</p>
      </div>

      <form id="formExport" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Absensi</label>
          <select id="inputTipe" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
            <option value="gerbang">Absen Gerbang (Masuk/Pulang)</option>
            <option value="mapel">Absen Mata Pelajaran</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Mulai</label>
            <input type="date" id="inputStart" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Selesai</label>
            <input type="date" id="inputEnd" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
          </div>
        </div>

        <div class="pt-4 border-t mt-6">
          <button type="submit" id="btnExport" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Download File CSV
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script>
    // Set Tanggal Hari Ini & Default Range (Awal Bulan - Hari Ini)
    const today = new Date();
    const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
    
    // Format YYYY-MM-DD untuk input date
    const formatDateInput = (date) => {
      const d = new Date(date);
      let month = '' + (d.getMonth() + 1);
      let day = '' + d.getDate();
      const year = d.getFullYear();
      if (month.length < 2) month = '0' + month;
      if (day.length < 2) day = '0' + day;
      return [year, month, day].join('-');
    };

    document.getElementById('inputStart').value = formatDateInput(firstDay);
    document.getElementById('inputEnd').value = formatDateInput(today);
    document.getElementById('headerTanggalExport').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    window.addEventListener('DOMContentLoaded', () => {
      const user = Auth.getUser();
      // Izinkan admin dan guru
      if (!user || (user.role !== 'admin' && user.role !== 'guru')) {
        Swal.fire('Akses Ditolak', 'Halaman ini hanya untuk Admin dan Guru.', 'error').then(() => {
          window.location.href = 'dashboard.html';
        });
      }
    });

    document.getElementById('formExport').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnExport');
      btn.disabled = true;

      const tipe = document.getElementById('inputTipe').value;
      const startDate = document.getElementById('inputStart').value;
      const endDate = document.getElementById('inputEnd').value;

      if (startDate > endDate) {
        btn.disabled = false;
        return Swal.fire('Peringatan', 'Tanggal mulai tidak boleh lebih besar dari tanggal selesai.', 'warning');
      }

      Swal.fire({
        title: 'Mengambil Data...',
        text: 'Mohon tunggu sebentar.',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      try {
        const res = await API.post('getExportData', { token: Auth.getToken(), tipe, startDate, endDate });
        
        if (!res.success) throw new Error(res.message);
        if (res.data.length === 0) {
          btn.disabled = false;
          return Swal.fire('Data Kosong', 'Tidak ada data absensi pada rentang tanggal tersebut.', 'info');
        }

        // --- PROSES KONVERSI KE CSV ---
        const items = res.data;
        const headers = Object.keys(items[0]);
        
        let csvContent = "";
        
        // Header
        csvContent += headers.join(";") + "\r\n";
        
        // Rows
        items.forEach(row => {
          const values = headers.map(header => {
            let val = row[header] === null || row[header] === undefined ? '' : String(row[header]);
            // Bersihkan karakter titik koma dan enter agar tidak merusak format CSV
            val = val.replace(/;/g, ',').replace(/\n/g, ' ').replace(/\r/g, '');
            return `"${val}"`; // Bungkus dengan kutip
          });
          csvContent += values.join(";") + "\r\n";
        });

        // Buat File Blob
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        
        // Trigger Download
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Laporan_Absen_${tipe.toUpperCase()}_${startDate}_sd_${endDate}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        Swal.fire('Berhasil!', `Berhasil mengunduh ${items.length} data absensi.`, 'success');
        btn.disabled = false;

      } catch (err) {
        Swal.fire('Gagal', err.message, 'error');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
