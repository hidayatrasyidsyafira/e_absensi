<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Mapel — Absensi QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-10">

  <nav class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <a href="dashboard.html" class="text-gray-500 hover:text-blue-600 font-medium">&larr; Kembali</a>
      <span class="font-semibold text-gray-900 ml-2 border-l pl-4 border-gray-300">Mata Pelajaran</span>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto p-4 mt-4">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold text-gray-800">Daftar Mata Pelajaran</h1>
      <button onclick="bukaModalTambah()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm">
        + Tambah Mapel
      </button>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider">
            <th class="p-3 border-b w-24">Kode</th>
            <th class="p-3 border-b">Nama Mata Pelajaran</th>
            <th class="p-3 border-b text-right w-32">Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelMapel" class="text-sm divide-y divide-gray-100">
          <tr><td colspan="3" class="text-center p-4 text-gray-500">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- MODAL FORM -->
  <div id="modalMapel" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-6">
      <h2 class="text-xl font-bold mb-4" id="modalTitle">Tambah Mapel Baru</h2>
      <form id="formMapel" class="space-y-4">
        <input type="hidden" id="modeEdit" value="false">
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Kode Mapel</label>
          <input type="text" id="inputKode" class="w-full px-3 py-2 border rounded-lg uppercase" placeholder="Contoh: MTK" required maxlength="10">
          <p class="text-[10px] text-gray-500 mt-1" id="infoKode">*Kode tidak bisa diubah setelah disimpan.</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
          <input type="text" id="inputNama" class="w-full px-3 py-2 border rounded-lg" placeholder="Contoh: Matematika" required>
        </div>

        <div class="flex gap-2 justify-end pt-4 border-t mt-4">
          <button type="button" onclick="tutupModal()" class="px-4 py-2 text-gray-600 font-medium hover:bg-gray-100 rounded-lg">Batal</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700" id="btnSimpan">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const user = Auth.getUser();
      if (!user || user.role !== 'admin') {
        alert('Halaman ini hanya untuk Admin.');
        window.location.href = 'dashboard.html';
        return;
      }
      loadDataMapel();
    });

    async function loadDataMapel() {
      const tbody = document.getElementById('tabelMapel');
      tbody.innerHTML = '<tr><td colspan="3" class="text-center p-4 text-gray-500">Memuat data...</td></tr>';
      
      const res = await API.post('getAllMapel', { token: Auth.getToken() });
      if (!res.success) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-center p-4 text-red-500">${res.message}</td></tr>`;
        return;
      }

      if (res.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center p-4 text-gray-500">Belum ada data mapel.</td></tr>';
        return;
      }

      tbody.innerHTML = res.data.map(m => `
        <tr>
          <td class="p-3 border-b font-mono font-bold text-blue-600">${m.kode}</td>
          <td class="p-3 border-b font-medium text-gray-800">${m.nama}</td>
          <td class="p-3 border-b text-right space-x-1">
            <button onclick="bukaModalEdit('${m.kode}', '${m.nama}')" class="px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs font-semibold hover:bg-blue-200">Edit</button>
            <button onclick="hapusMapel('${m.kode}')" class="px-2 py-1 bg-red-100 text-red-700 rounded text-xs font-semibold hover:bg-red-200">Hapus</button>
          </td>
        </tr>
      `).join('');
    }

    // --- MODAL LOGIC ---
    const modal = document.getElementById('modalMapel');
    const form = document.getElementById('formMapel');
    const inputKode = document.getElementById('inputKode');
    const infoKode = document.getElementById('infoKode');

    function bukaModalTambah() {
      document.getElementById('modalTitle').textContent = 'Tambah Mapel Baru';
      document.getElementById('modeEdit').value = 'false';
      form.reset();
      inputKode.readOnly = false;
      inputKode.classList.remove('bg-gray-100');
      infoKode.style.display = 'block';
      modal.classList.remove('hidden');
    }

    function bukaModalEdit(kode, nama) {
      document.getElementById('modalTitle').textContent = 'Edit Nama Mapel';
      document.getElementById('modeEdit').value = 'true';
      
      inputKode.value = kode;
      inputKode.readOnly = true; // Kode dikunci saat edit
      inputKode.classList.add('bg-gray-100');
      
      document.getElementById('inputNama').value = nama;
      infoKode.style.display = 'none';
      
      modal.classList.remove('hidden');
    }

    function tutupModal() {
      modal.classList.add('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSimpan');
      btn.disabled = true; btn.textContent = 'Menyimpan...';

      const isEdit = document.getElementById('modeEdit').value === 'true';
      const payload = {
        token: Auth.getToken(),
        kode: inputKode.value.trim().toUpperCase(),
        nama: document.getElementById('inputNama').value.trim()
      };

      const action = isEdit ? 'editMapel' : 'tambahMapel';
      const res = await API.post(action, payload);

      if (res.success) {
        alert(res.message);
        tutupModal();
        loadDataMapel();
      } else {
        alert('Gagal: ' + res.message);
      }
      btn.disabled = false; btn.textContent = 'Simpan';
    });

    async function hapusMapel(kode) {
      if (!confirm(`Yakin ingin menghapus mapel ${kode}?`)) return;
      const res = await API.post('hapusMapel', { token: Auth.getToken(), kode });
      
      if (res.success) {
        loadDataMapel();
      } else {
        // Akan menolak jika mapel sudah dipakai di jadwal
        alert(res.message);
      }
    }
  </script>
</body>
</html>
