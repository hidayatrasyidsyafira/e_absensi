<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Gerbang — Absensi QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    #reader { border: none !important; }
    #reader video { border-radius: 1rem; object-fit: cover; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    /* Animasi untuk foto baru masuk */
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    
    /* Sembunyikan scrollbar area foto */
    #photoGrid::-webkit-scrollbar { width: 6px; }
    #photoGrid::-webkit-scrollbar-track { background: transparent; }
    #photoGrid::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
  </style>
</head>
<body class="bg-gray-900 text-white h-screen overflow-hidden flex flex-col md:flex-row">

  <!-- ========================================== -->
  <!-- KOLOM KIRI: SCANNER KAMERA                 -->
  <!-- ========================================== -->
  <div class="w-full md:w-1/2 h-full flex flex-col items-center justify-center p-4 relative z-20 shadow-2xl border-r border-gray-800">
    
    <div class="text-center mb-4 flex flex-col items-center">
      <div class="bg-gray-800 text-gray-300 px-4 py-1 rounded-full text-xs font-medium mb-3" id="headerTanggalScan">-</div>
      <h1 class="text-2xl font-bold text-white">Scanner Gerbang</h1>
      <p class="text-sm text-gray-400">Tempelkan Kartu Pelajar ke Kamera</p>
    </div>

    <!-- Area Kamera -->
    <div class="relative bg-black rounded-2xl overflow-hidden shadow-2xl aspect-square w-full max-w-sm flex items-center justify-center border-4 border-gray-700" id="cameraContainer">
      <div id="reader" class="w-full h-full"></div>
      
      <!-- Overlay Loading / Hasil -->
      <div id="resultOverlay" class="absolute inset-0 bg-black/80 backdrop-blur-sm z-10 hidden flex-col items-center justify-center text-center p-4 transition-all duration-300">
        <div id="resultIcon" class="text-7xl mb-4 drop-shadow-lg">⏳</div>
        <h2 id="resultName" class="text-3xl font-bold mb-1 text-white drop-shadow-md">Memproses...</h2>
        <p id="resultKelas" class="text-lg text-gray-300 mb-4"></p>
        <div id="resultStatus" class="px-5 py-2 rounded-full font-bold text-sm shadow-lg"></div>
      </div>
    </div>

    <!-- Kontrol Waktu & Tombol -->
    <div class="w-full max-w-sm mt-6">
      <div id="indikatorWaktu" class="text-center bg-gray-800 py-2 rounded-xl border border-gray-700 mb-3 shadow-inner">
        <p class="text-sm text-gray-400">Memuat konfigurasi...</p>
      </div>

      <div class="bg-gray-800 p-2 rounded-xl flex gap-2 shadow-lg">
        <button onclick="setTipe('masuk')" id="btnMasuk" class="flex-1 py-3 rounded-lg font-bold transition-all text-sm uppercase tracking-wider">
          Absen Masuk
        </button>
        <button onclick="setTipe('pulang')" id="btnPulang" class="flex-1 py-3 rounded-lg font-bold transition-all text-sm uppercase tracking-wider">
          Absen Pulang
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- KOLOM KANAN: WALL OF ATTENDANCE (FOTO)     -->
  <!-- ========================================== -->
  <div class="w-full md:w-1/2 h-full bg-gray-900 flex flex-col relative z-10 hidden md:flex">
    <div class="p-4 border-b border-gray-800 bg-gray-800/50 flex justify-between items-center sticky top-0 backdrop-blur-md z-20">
      <h2 class="font-bold text-gray-200 flex items-center gap-2">
        <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        Kehadiran Hari Ini
      </h2>
      <span class="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full" id="totalFoto">0</span>
    </div>

    <!-- Grid Foto -->
    <div id="photoGrid" class="flex-1 overflow-y-auto p-4 grid grid-cols-2 lg:grid-cols-3 gap-3 content-start">
      <!-- Foto akan dirender oleh JS -->
      <div class="col-span-full text-center py-10 text-gray-600 italic text-sm" id="emptyState">
        Belum ada siswa yang scan.
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  
  <script>
    let currentTipe = 'masuk';
    let isScanning = false;
    let html5QrCode;
    let batasTransisiMenit = null;
    let capturedPhotos = []; // Menyimpan data foto sementara
    let snapshotInterval = null;

    // Load Setting Waktu
    async function initWaktu() {
      try {
        const res = await API.get('getSettings');
        if (res.success) {
          const s = res.data;
          let jamPulang = s['jam_pulang'] || '15:00';
          
          if (String(jamPulang).includes('T')) {
             const d = new Date(jamPulang);
             jamPulang = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
          } else if (typeof jamPulang === 'string') {
             const parts = jamPulang.split(':');
             if(parts.length >= 2) jamPulang = parts[0].padStart(2, '0') + ':' + parts[1].padStart(2, '0');
          }

          const [hP, mP] = jamPulang.split(':').map(Number);
          batasTransisiMenit = (hP * 60) + mP - 60; // 1 jam sebelum pulang

          updateJamRealTime(); 
          setInterval(updateJamRealTime, 1000);
        }
      } catch(e) {
        console.error("Gagal memuat setting waktu", e);
      }
    }

    // Fungsi Update Jam & Cek Transisi Mode
    function updateJamRealTime() {
      if (batasTransisiMenit === null) return;

      const now = new Date();
      const hh = now.getHours().toString().padStart(2, '0');
      const mm = now.getMinutes().toString().padStart(2, '0');
      const ss = now.getSeconds().toString().padStart(2, '0');
      
      const currentMenit = (now.getHours() * 60) + now.getMinutes();
      
      const infoEl = document.getElementById('indikatorWaktu');
      const btnMasuk = document.getElementById('btnMasuk');
      const btnPulang = document.getElementById('btnPulang');

      if (currentMenit >= batasTransisiMenit) {
        if (currentTipe !== 'pulang') {
           setTipe('pulang');
           btnMasuk.disabled = true;
           btnMasuk.innerHTML = 'Terkunci';
           btnPulang.innerHTML = 'Absen Pulang';
        }
        infoEl.innerHTML = `<p class="text-sm text-gray-400">Sekarang: <b class="text-white">${hh}:${mm}:${ss}</b> | Mode: <b class="text-blue-400">PULANG</b></p>`;
      } else {
        if (currentTipe !== 'masuk') {
           setTipe('masuk');
           btnPulang.disabled = true;
           btnPulang.innerHTML = 'Terkunci';
           btnMasuk.innerHTML = 'Absen Masuk';
        }
        infoEl.innerHTML = `<p class="text-sm text-gray-400">Sekarang: <b class="text-white">${hh}:${mm}:${ss}</b> | Mode: <b class="text-green-400">MASUK</b></p>`;
      }
    }

    function setTipe(tipe) {
      currentTipe = tipe;
      const btnMasuk = document.getElementById('btnMasuk');
      const btnPulang = document.getElementById('btnPulang');

      if (tipe === 'masuk') {
        btnMasuk.className = 'flex-1 py-3 rounded-lg font-bold transition-all text-sm uppercase tracking-wider bg-blue-600 text-white shadow-md';
        if (!btnPulang.disabled) btnPulang.className = 'flex-1 py-3 rounded-lg font-bold transition-all text-sm uppercase tracking-wider text-gray-400 hover:bg-gray-700';
      } else {
        btnPulang.className = 'flex-1 py-3 rounded-lg font-bold transition-all text-sm uppercase tracking-wider bg-blue-600 text-white shadow-md';
        if (!btnMasuk.disabled) btnMasuk.className = 'flex-1 py-3 rounded-lg font-bold transition-all text-sm uppercase tracking-wider text-gray-400 hover:bg-gray-700';
      }
    }

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).catch(err => {
        alert("Gagal mengakses kamera: " + err);
      });
    }

    // Ambil Snapshot dari Video Kamera
    function captureSnapshot() {
      try {
        const video = document.querySelector('#reader video');
        if (!video) return null;
        
        const canvas = document.createElement('canvas');
        canvas.width = 300; // Resolusi kecil agar ringan
        canvas.height = 300;
        const ctx = canvas.getContext('2d');
        
        // Crop tengah video agar pas persegi
        const size = Math.min(video.videoWidth, video.videoHeight);
        const startX = (video.videoWidth - size) / 2;
        const startY = (video.videoHeight - size) / 2;
        
        ctx.drawImage(video, startX, startY, size, size, 0, 0, 300, 300);
        return canvas.toDataURL('image/jpeg', 0.7);
      } catch (e) {
        console.error("Gagal mengambil snapshot:", e);
        return null;
      }
    }

        // Fungsi untuk mengambil foto secara diam-diam setiap 500ms
    function startSnapshotLoop() {
      snapshotInterval = setInterval(() => {
        const video = document.querySelector('#reader video');
        if (video && video.readyState === 4) {
          const canvas = document.createElement('canvas');
          canvas.width = 300; 
          canvas.height = 300;
          const ctx = canvas.getContext('2d');
          
          const size = Math.min(video.videoWidth, video.videoHeight);
          const startX = (video.videoWidth - size) / 2;
          const startY = (video.videoHeight - size) / 2;
          
          ctx.drawImage(video, startX, startY, size, size, 0, 0, 300, 300);
          latestSnapshot = canvas.toDataURL('image/jpeg', 0.7);
        }
      }, 500); // Ambil foto setiap 0.5 detik
    }

    async function onScanSuccess(decodedText) {
      if (isScanning) return;
      isScanning = true;

      if (navigator.vibrate) navigator.vibrate(200);

      // 1. Ambil Foto SEBELUM overlay menutupi kamera
      const photoData = latestSnapshot;

      const overlay = document.getElementById('resultOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      document.getElementById('resultIcon').textContent = '⏳';
      document.getElementById('resultName').textContent = 'Memproses...';
      document.getElementById('resultKelas').textContent = decodedText;
      document.getElementById('resultStatus').className = 'hidden';

      // 2. Kirim ke API
      const res = await API.post('absenGerbang', { nisn: decodedText, tipe: currentTipe });
      
      // 3. Tampilkan Hasil di Layar Scanner
      if (res.success) {
        document.getElementById('resultIcon').textContent = res.data.status === 'terlambat' ? '⚠️' : '✅';
        document.getElementById('resultName').textContent = res.data.nama;
        document.getElementById('resultKelas').textContent = res.data.kelas;
        
        const statEl = document.getElementById('resultStatus');
        statEl.classList.remove('hidden');
        if (res.data.status === 'tepat') {
          statEl.textContent = `Masuk Tepat Waktu - ${res.data.jam}`;
          statEl.className = 'px-4 py-2 rounded-full font-bold text-sm bg-green-500 text-white shadow-lg shadow-green-500/50';
        } else {
          statEl.textContent = `Terlambat - ${res.data.jam}`;
          statEl.className = 'px-4 py-2 rounded-full font-bold text-sm bg-yellow-500 text-white shadow-lg shadow-yellow-500/50';
        }

        // Tampilkan Foto ke Grid Kanan
        if (photoData) {
          addPhotoToWall(photoData, res.data.nama, res.data.kelas, res.data.jam, res.data.status);
        }

      } else {
        document.getElementById('resultIcon').textContent = '❌';
        document.getElementById('resultName').textContent = 'Gagal';
        
        const statEl = document.getElementById('resultStatus');
        statEl.classList.remove('hidden');
        statEl.textContent = res.message;
        statEl.className = 'px-4 py-2 rounded-full font-bold text-sm bg-red-500 text-white shadow-lg shadow-red-500/50';
      }

      setTimeout(() => {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        isScanning = false;
      }, 3000);
    }

    // Fungsi Menambahkan Foto ke Grid Kanan
    function addPhotoToWall(photoB64, nama, kelas, jam, status) {
      const grid = document.getElementById('photoGrid');
      const empty = document.getElementById('emptyState');
      if (empty) empty.style.display = 'none';

      // Buat elemen kartu foto
      const card = document.createElement('div');
      card.className = 'bg-gray-800 rounded-xl overflow-hidden shadow-lg border border-gray-700 animate-pop relative group';
      
      const badgeColor = status === 'tepat' ? 'bg-green-500' : 'bg-yellow-500';

      card.innerHTML = `
        <div class="aspect-square w-full relative">
          <img src="${photoB64}" class="w-full h-full object-cover">
          <div class="absolute bottom-1 right-1 ${badgeColor} text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">
            ${jam}
          </div>
        </div>
        <div class="p-2 text-center bg-gray-800">
          <p class="text-xs font-bold text-white truncate">${nama}</p>
          <p class="text-[10px] text-gray-400">${kelas}</p>
        </div>
      `;

      // Masukkan ke paling atas grid
      grid.prepend(card);
      
      // Hitung total
      const total = grid.querySelectorAll('.animate-pop').length;
      document.getElementById('totalFoto').textContent = total;
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('headerTanggalScan').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      initWaktu();
      startScanner();

      startSnapshotLoop(); 
    });
  </script>
</body>
</html>
