<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Guru & Admin — Absensi QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-10">

 <nav class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <span class="font-semibold text-gray-900 text-lg">Manajemen Guru & Admin</span>
    </div>
    <div class="text-sm text-gray-500 font-medium" id="headerTanggalUsers">-</div>
  </nav>

  <main class="max-w-4xl mx-auto p-4 mt-4">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold text-gray-800">Daftar Guru & Admin</h1>
      <button onclick="bukaModalTambah()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm">
        + Tambah User
      </button>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider">
              <th class="p-3 border-b">Nama / ID</th>
              <th class="p-3 border-b">NIP / Email</th>
              <th class="p-3 border-b">Role</th>
              <th class="p-3 border-b">Wali Kelas</th>
              <th class="p-3 border-b">Status</th>
              <th class="p-3 border-b text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelUser" class="text-sm divide-y divide-gray-100">
            <!-- Render JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL FORM -->
  <div id="modalUser" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
      <h2 class="text-xl font-bold mb-4" id="modalTitle">Tambah User Baru</h2>
      <form id="formUser" class="space-y-4">
        <input type="hidden" id="userId" value="">
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
          <input type="text" id="inputNama" class="w-full px-3 py-2 border rounded-lg" required>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">NIP / NIS</label>
            <input type="text" id="inputNip" class="w-full px-3 py-2 border rounded-lg" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="inputEmail" class="w-full px-3 py-2 border rounded-lg" required>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
            <select id="inputRole" class="w-full px-3 py-2 border rounded-lg" required onchange="toggleWaliKelas()">
              <option value="guru">Guru</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div id="formWaliKelas">
            <label class="block text-sm font-medium text-gray-700 mb-1">Wali Kelas (Opsional)</label>
            <input type="text" id="inputWaliKelas" class="w-full px-3 py-2 border rounded-lg" placeholder="Contoh: X-IPA-1">
          </div>
        </div>

        <div class="flex gap-2 justify-end pt-4 border-t mt-4">
          <button type="button" onclick="tutupModal()" class="px-4 py-2 text-gray-600 font-medium hover:bg-gray-100 rounded-lg">Batal</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700" id="btnSimpan">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const user = Auth.getUser();
      if (!user || user.role !== 'admin') {
        alert('Halaman ini hanya untuk Admin.');
        window.location.href = 'dashboard.html';
        return;
      }
      loadDataUser();
    });

    async function loadDataUser() {
      const tbody = document.getElementById('tabelUser');
      tbody.innerHTML = '<tr><td colspan="6" class="text-center p-4 text-gray-500">Memuat data...</td></tr>';
      
      const res = await API.post('getAllUsers', { token: Auth.getToken() });
      if (!res.success) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center p-4 text-red-500">${res.message}</td></tr>`;
        return;
      }

      tbody.innerHTML = res.data.map(u => {
        const isAktif = u.status === 'aktif';
        const roleColor = u.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700';
        
        return `
        <tr class="${isAktif ? '' : 'bg-gray-50 opacity-75'}">
          <td class="p-3 border-b">
            <div class="font-bold text-gray-800">${u.nama}</div>
            <div class="text-xs text-gray-500 font-mono">${u.id}</div>
          </td>
          <td class="p-3 border-b">
            <div class="text-gray-800">${u.nis_nip}</div>
            <div class="text-xs text-gray-500">${u.email}</div>
          </td>
          <td class="p-3 border-b">
            <span class="px-2 py-1 text-[10px] font-bold uppercase rounded ${roleColor}">${u.role}</span>
          </td>
          <td class="p-3 border-b text-gray-800 font-medium">${u.wali_kelas || '-'}</td>
          <td class="p-3 border-b">
            <span class="px-2 py-1 text-[10px] font-bold uppercase rounded ${isAktif ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${u.status}</span>
          </td>
          <td class="p-3 border-b text-right space-x-1 flex justify-end gap-1">
            <button onclick='bukaModalEdit(${JSON.stringify(u)})' class="px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs font-semibold hover:bg-blue-200">Edit</button>
            <button onclick="resetPassword('${u.id}')" class="px-2 py-1 bg-yellow-100 text-yellow-700 rounded text-xs font-semibold hover:bg-yellow-200" title="Reset ke sekolah123">Reset</button>
            <button onclick="toggleStatus('${u.id}', '${isAktif ? 'nonaktif' : 'aktif'}')" class="px-2 py-1 ${isAktif ? 'bg-red-100 text-red-700 hover:bg-red-200' : 'bg-green-100 text-green-700 hover:bg-green-200'} rounded text-xs font-semibold">
              ${isAktif ? 'Off' : 'On'}
            </button>
          </td>
        </tr>
      `}).join('');
    }

    // --- MODAL LOGIC ---
    const modal = document.getElementById('modalUser');
    const form = document.getElementById('formUser');

    function toggleWaliKelas() {
      const role = document.getElementById('inputRole').value;
      document.getElementById('formWaliKelas').style.display = role === 'guru' ? 'block' : 'none';
    }

    function bukaModalTambah() {
      document.getElementById('modalTitle').textContent = 'Tambah User Baru';
      document.getElementById('userId').value = '';
      form.reset();
      toggleWaliKelas();
      modal.classList.remove('hidden');
    }

    function bukaModalEdit(data) {
      document.getElementById('modalTitle').textContent = 'Edit Data User';
      document.getElementById('userId').value = data.id;
      document.getElementById('inputNama').value = data.nama;
      document.getElementById('inputNip').value = data.nis_nip;
      document.getElementById('inputEmail').value = data.email;
      document.getElementById('inputRole').value = data.role;
      document.getElementById('inputWaliKelas').value = data.wali_kelas || '';
      toggleWaliKelas();
      modal.classList.remove('hidden');
    }

    function tutupModal() {
      modal.classList.add('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSimpan');
      btn.disabled = true; btn.textContent = 'Menyimpan...';

      const userId = document.getElementById('userId').value;
      const isEdit = userId !== '';

      const payload = {
        token: Auth.getToken(),
        id: userId,
        nama: document.getElementById('inputNama').value,
        nis_nip: document.getElementById('inputNip').value,
        email: document.getElementById('inputEmail').value,
        role: document.getElementById('inputRole').value,
        wali_kelas: document.getElementById('inputWaliKelas').value
      };

      const action = isEdit ? 'editUser' : 'tambahUser';
      const res = await API.post(action, payload);

      if (res.success) {
        alert(res.message);
        tutupModal();
        loadDataUser();
      } else {
        alert('Gagal: ' + res.message);
      }
      btn.disabled = false; btn.textContent = 'Simpan';
    });

    async function resetPassword(id) {
      if (!confirm('Yakin ingin mereset password user ini menjadi "sekolah123"?')) return;
      const res = await API.post('aksiUser', { token: Auth.getToken(), id: id, aksi: 'reset' });
      alert(res.message);
    }

    async function toggleStatus(id, newStatus) {
      if (!confirm(`Yakin ingin mengubah status user ini menjadi ${newStatus}?`)) return;
      const res = await API.post('aksiUser', { token: Auth.getToken(), id: id, aksi: 'toggle', status: newStatus });
      if (res.success) loadDataUser();
      else alert(res.message);
    }
  </script>
</body>
</html>
