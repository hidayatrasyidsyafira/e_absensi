<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda — Absensi QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Sembunyikan scrollbar bawaan iframe agar lebih rapi */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-6 pb-20">

  <!-- Header Sambutan -->
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-gray-800" id="greeting">Memuat...</h1>
    <p class="text-sm text-gray-500" id="roleInfo">-</p>
  </div>

  <!-- ========================================== -->
  <!-- TAMPILAN ADMIN (Statistik & Rekap)          -->
  <!-- ========================================== -->
  <div id="panelAdmin" class="hidden space-y-6">
    <h2 class="font-bold text-gray-800 text-lg flex items-center gap-2">
      <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
      Statistik Kehadiran Hari Ini
    </h2>
    
    <!-- Kotak Statistik -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-green-500">
        <p class="text-xs text-gray-500 font-medium mb-1 uppercase tracking-wider">Hadir Gerbang</p>
        <div class="flex items-end gap-2">
          <p class="text-3xl font-bold text-gray-800" id="statGerbang">0</p>
          <p class="text-sm text-gray-400 mb-1">/ <span id="statTotalSiswa">0</span></p>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-yellow-500">
        <p class="text-xs text-gray-500 font-medium mb-1 uppercase tracking-wider">Terlambat</p>
        <p class="text-3xl font-bold text-gray-800" id="statTerlambat">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-blue-500">
        <p class="text-xs text-gray-500 font-medium mb-1 uppercase tracking-wider">Scan Mapel</p>
        <p class="text-3xl font-bold text-gray-800" id="statMapel">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-purple-500">
        <p class="text-xs text-gray-500 font-medium mb-1 uppercase tracking-wider">Sesi Aktif</p>
        <p class="text-3xl font-bold text-gray-800" id="statSesi">0</p>
      </div>
    </div>

    <!-- Rekap Siswa Belum Absen (Alpha) -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-4 border-b border-gray-100 bg-red-50 flex items-center justify-between">
        <h3 class="font-bold text-red-700 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
          Siswa Belum Absen Gerbang Hari Ini
        </h3>
      </div>
      <div id="listAlphaGerbang" class="max-h-[300px] overflow-y-auto p-2 space-y-1">
        <!-- Render JS -->
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- TAMPILAN GURU (Persetujuan Izin & Wali Kelas) -->
  <!-- ========================================== -->
  <div id="panelGuru" class="hidden space-y-6">
    
    <!-- Panel Wali Kelas (Jika Guru adalah Wali Kelas) -->
    <div id="panelWaliKelas" class="hidden">
      <div class="bg-white rounded-xl shadow-sm border border-blue-200 overflow-hidden">
        <div class="bg-blue-600 p-4 text-white flex justify-between items-center">
          <h2 class="font-bold flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            Rekap Kelas Wali: <span id="infoWaliKelas">-</span>
          </h2>
          <span class="text-xs bg-blue-700/50 px-2 py-1 rounded" id="tanggalWaliKelas">-</span>
        </div>
        <div class="p-4">
          <div class="grid grid-cols-4 gap-2 mb-4 text-center">
            <div class="bg-gray-50 p-2 rounded-lg border">
              <p class="text-[10px] text-gray-500 font-bold uppercase">Total</p>
              <p class="text-lg font-bold text-gray-800" id="wkTotal">0</p>
            </div>
            <div class="bg-green-50 p-2 rounded-lg border border-green-100">
              <p class="text-[10px] text-green-600 font-bold uppercase">Hadir</p>
              <p class="text-lg font-bold text-green-600" id="wkHadir">0</p>
            </div>
            <div class="bg-yellow-50 p-2 rounded-lg border border-yellow-100">
              <p class="text-[10px] text-yellow-600 font-bold uppercase">Izin/Sakit</p>
              <p class="text-lg font-bold text-yellow-600" id="wkIzin">0</p>
            </div>
            <div class="bg-red-50 p-2 rounded-lg border border-red-100">
              <p class="text-[10px] text-red-600 font-bold uppercase">Alpha</p>
              <p class="text-lg font-bold text-red-600" id="wkAlpha">0</p>
            </div>
          </div>
          <div class="max-h-60 overflow-y-auto space-y-2 pr-1">
            <div id="listWaliKelas" class="space-y-2"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel Persetujuan Izin -->
    <div>
      <h2 class="font-bold text-gray-800 text-lg mb-3 flex items-center gap-2">
        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        Persetujuan Izin Siswa
      </h2>
      <div id="listPersetujuanIzin" class="space-y-3"></div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- TAMPILAN SISWA (Riwayat)                    -->
  <!-- ========================================== -->
  <div id="panelSiswa" class="hidden">
    <div class="flex gap-2 mb-4 bg-gray-200 p-1 rounded-xl">
      <button onclick="switchTab('gerbang')" id="tabBtnGerbang" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white shadow text-blue-600 transition-all">Riwayat Gerbang</button>
      <button onclick="switchTab('mapel')" id="tabBtnMapel" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500 hover:text-gray-800 transition-all">Riwayat Mapel</button>
      <button onclick="switchTab('izin')" id="tabBtnIzin" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500 hover:text-gray-800 transition-all">Izin / Sakit</button>
    </div>

    <div id="listGerbang" class="space-y-2"></div>
    <div id="listMapel" class="space-y-2 hidden"></div>
    <div id="listIzin" class="space-y-2 hidden">
      <button onclick="document.getElementById('modalIzin').classList.remove('hidden')" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl mb-4 hover:bg-blue-700 transition-colors shadow-sm">
        + Ajukan Izin / Sakit
      </button>
      <div id="riwayatIzinSiswa" class="space-y-2"></div>
    </div>
  </div>

  <!-- MODAL FORM IZIN -->
  <div id="modalIzin" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6">
      <h2 class="text-xl font-bold mb-4">Formulir Pengajuan Izin</h2>
      <form id="formIzin" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Jenis</label>
          <select id="izinJenis" class="w-full px-3 py-2 border rounded-lg" required>
            <option value="Sakit">Sakit</option>
            <option value="Izin">Izin (Keperluan Keluarga/Lainnya)</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Mulai</label>
            <input type="date" id="izinMulai" class="w-full px-3 py-2 border rounded-lg" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Selesai</label>
            <input type="date" id="izinSelesai" class="w-full px-3 py-2 border rounded-lg" required>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Alasan Singkat</label>
          <textarea id="izinAlasan" rows="3" class="w-full px-3 py-2 border rounded-lg" required placeholder="Contoh: Demam tinggi, surat dokter menyusul."></textarea>
        </div>
        <div class="flex gap-2 justify-end pt-2">
          <button type="button" onclick="document.getElementById('modalIzin').classList.add('hidden')" class="px-4 py-2 text-gray-600 font-medium hover:bg-gray-100 rounded-lg">Batal</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700">Kirim</button>
        </div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script>
    function formatTgl(str) {
      if(!str || str === '-') return '-';
      try {
        const d = new Date(str);
        if (isNaN(d.getTime())) return str;
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
      } catch (e) { return str; }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const user = Auth.getUser();
      if (!user) return;

      document.getElementById('greeting').textContent = `Halo, ${user.nama} 👋`;
      document.getElementById('roleInfo').textContent = `Login sebagai ${user.role.toUpperCase()}`;

      // Tampilkan Panel Berdasarkan Role
      if (user.role === 'admin') {
        document.getElementById('panelAdmin').classList.remove('hidden');
      } else if (user.role === 'guru') {
        document.getElementById('panelGuru').classList.remove('hidden');
        loadPersetujuanIzin();
        if (user.wali_kelas) loadWaliKelas(user.wali_kelas);
      } else if (user.role === 'siswa') {
        document.getElementById('panelSiswa').classList.remove('hidden');
      }

      // Load Data Rekap
      const res = await API.post('getRekap', { token: Auth.getToken() });
      if (!res.success) {
        document.getElementById('greeting').textContent = 'Gagal memuat data.';
        document.getElementById('roleInfo').innerHTML = `<span class="text-red-500">${res.message}</span>`;
        return;
      }

      if (user.role === 'admin') {
        document.getElementById('statGerbang').textContent = res.data.hadirGerbang;
        document.getElementById('statTerlambat').textContent = res.data.terlambatGerbang;
        document.getElementById('statMapel').textContent = res.data.totalScanMapel;
        document.getElementById('statSesi').textContent = res.data.sesiAktif;
        document.getElementById('statTotalSiswa').textContent = res.data.totalSiswa;

        const listAlpha = document.getElementById('listAlphaGerbang');
        if (res.data.siswaAlphaGerbang.length === 0) {
          listAlpha.innerHTML = '<div class="bg-green-50 text-green-700 text-sm p-3 m-2 rounded-xl border border-green-200">Luar biasa! Semua siswa sudah absen gerbang hari ini.</div>';
        } else {
          listAlpha.innerHTML = res.data.siswaAlphaGerbang.map(s => `
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 flex justify-between items-center">
              <div>
                <div class="font-bold text-gray-800 text-sm">${s.nama}</div>
                <div class="text-xs text-gray-500">${s.kelas}</div>
              </div>
              <div class="text-[10px] font-bold uppercase tracking-wider text-red-500 bg-red-100 px-2 py-1 rounded">Belum Masuk</div>
            </div>
          `).join('');
        }
      } 
      
      else if (user.role === 'siswa') {
        // Render Gerbang
        const listG = document.getElementById('listGerbang');
        if (res.data.gerbang.length === 0) {
          listG.innerHTML = '<div class="text-center py-6 text-gray-400 text-sm bg-white rounded-xl">Belum ada riwayat.</div>';
        } else {
          listG.innerHTML = res.data.gerbang.map(g => `
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
              <div>
                <div class="font-bold text-gray-800 text-sm capitalize">Absen ${g.tipe}</div>
                <div class="text-xs text-gray-500">${formatTgl(g.tanggal)}</div>
              </div>
              <div class="text-right">
                <div class="font-mono text-sm ${g.status === 'terlambat' ? 'text-yellow-600' : 'text-green-600'}">${String(g.jam).substring(0,5)}</div>
                <div class="text-[10px] font-bold uppercase tracking-wider ${g.status === 'terlambat' ? 'text-yellow-500' : 'text-green-500'}">${g.status}</div>
              </div>
            </div>
          `).join('');
        }

        // Render Mapel
        const listM = document.getElementById('listMapel');
        if (res.data.mapel.length === 0) {
          listM.innerHTML = '<div class="text-center py-6 text-gray-400 text-sm bg-white rounded-xl">Belum ada riwayat.</div>';
        } else {
          listM.innerHTML = res.data.mapel.map(m => `
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
              <div>
                <div class="font-bold text-gray-800 text-sm">${m.mapel}</div>
                <div class="text-xs text-gray-500">Jam ke-${m.jam_ke} • ${m.kelas}</div>
              </div>
              <div class="text-right">
                <div class="text-xs text-gray-500">${formatTgl(m.tanggal)}</div>
                <div class="text-[10px] font-bold uppercase tracking-wider text-green-500">${m.status}</div>
              </div>
            </div>
          `).join('');
        }

        loadRiwayatIzinSiswa();
      }
    });

    // ==========================================
    // FITUR IZIN (SISWA)
    // ==========================================
    async function loadRiwayatIzinSiswa() {
      const res = await API.post('getIzin', { token: Auth.getToken() });
      const box = document.getElementById('riwayatIzinSiswa');
      if (!res.success) return;
      
      if (res.data.list.length === 0) {
        box.innerHTML = '<div class="text-center py-4 text-gray-400 text-sm bg-white rounded-xl">Belum ada pengajuan izin.</div>';
        return;
      }

      box.innerHTML = res.data.list.map(i => {
        let badgeColor = 'bg-gray-100 text-gray-600';
        if (i.status === 'approved') badgeColor = 'bg-green-100 text-green-700';
        if (i.status === 'rejected') badgeColor = 'bg-red-100 text-red-700';
        
        return `
          <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-start mb-1">
              <div class="font-bold text-gray-800 text-sm">${i.jenis}</div>
              <span class="text-[10px] font-bold uppercase px-2 py-1 rounded ${badgeColor}">${i.status}</span>
            </div>
            <div class="text-xs text-gray-500">${formatTgl(i.tanggal_mulai)} s/d ${formatTgl(i.tanggal_selesai)}</div>
            <div class="text-xs text-gray-600 mt-2 italic">"${i.alasan}"</div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('formIzin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'Mengirim...';

      const res = await API.post('ajukanIzin', {
        token: Auth.getToken(),
        jenis: document.getElementById('izinJenis').value,
        tanggal_mulai: document.getElementById('izinMulai').value,
        tanggal_selesai: document.getElementById('izinSelesai').value,
        alasan: document.getElementById('izinAlasan').value
      });

      if (res.success) {
        alert(res.message);
        document.getElementById('modalIzin').classList.add('hidden');
        e.target.reset();
        loadRiwayatIzinSiswa();
      } else {
        alert(res.message);
      }
      btn.disabled = false; btn.textContent = 'Kirim';
    });

    // ==========================================
    // FITUR PERSETUJUAN IZIN (GURU)
    // ==========================================
    async function loadPersetujuanIzin() {
      const res = await API.post('getIzin', { token: Auth.getToken() });
      const box = document.getElementById('listPersetujuanIzin');
      
      if (!res.success) {
        box.innerHTML = `<div class="text-red-500 text-sm text-center bg-red-50 p-3 rounded-xl border border-red-200">Gagal memuat: ${res.message}</div>`;
        return;
      }

      if (res.data.list.length === 0) {
        box.innerHTML = '<div class="text-center py-4 text-gray-500 text-sm bg-white rounded-xl border border-gray-100">Tidak ada pengajuan izin yang menunggu persetujuan.</div>';
        return;
      }

      box.innerHTML = res.data.list.map(i => `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
          <div class="flex justify-between items-start mb-2">
            <div>
              <div class="font-bold text-gray-800 text-sm">${i.nama_siswa}</div>
              <div class="text-xs text-blue-600 font-medium">${i.jenis}</div>
            </div>
            <div class="text-xs text-gray-500 text-right">${formatTgl(i.tanggal_mulai)}<br>s/d ${formatTgl(i.tanggal_selesai)}</div>
          </div>
          <p class="text-xs text-gray-600 italic mb-3">"${i.alasan}"</p>
          <div class="flex gap-2">
            <button onclick="updateIzin('${i.id}', 'rejected')" class="flex-1 py-2 bg-red-100 text-red-700 rounded-lg text-sm font-semibold hover:bg-red-200">Tolak</button>
            <button onclick="updateIzin('${i.id}', 'approved')" class="flex-1 py-2 bg-green-600 text-white rounded-lg text-sm font-semibold hover:bg-green-700">Setujui</button>
          </div>
        </div>
      `).join('');
    }

    async function updateIzin(id, status) {
      if (!confirm(`Yakin ingin menandai izin ini sebagai ${status}?`)) return;
      const res = await API.post('updateStatusIzin', { token: Auth.getToken(), id, status });
      if (res.success) loadPersetujuanIzin();
      else alert(res.message);
    }

    // ==========================================
    // FITUR WALI KELAS (GURU)
    // ==========================================
    async function loadWaliKelas(kelas) {
      document.getElementById('panelWaliKelas').classList.remove('hidden');
      document.getElementById('infoWaliKelas').textContent = kelas;
      
      const today = new Date();
      document.getElementById('tanggalWaliKelas').textContent = today.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
      document.getElementById('listWaliKelas').innerHTML = '<div class="text-center text-sm text-gray-400 py-4">Memuat data...</div>';

      const res = await API.post('getRekapWaliKelas', { token: Auth.getToken(), kelas });
      
      if (!res.success) {
        document.getElementById('listWaliKelas').innerHTML = `<div class="text-red-500 text-sm bg-red-50 p-3 rounded-lg text-center">Gagal memuat: ${res.message}</div>`;
        return;
      }

      const d = res.data;
      document.getElementById('wkTotal').textContent = d.total;
      document.getElementById('wkHadir').textContent = d.hadir;
      document.getElementById('wkIzin').textContent = d.izinSakit;
      document.getElementById('wkAlpha').textContent = d.alpha;

      const list = document.getElementById('listWaliKelas');
      if (d.detail.length === 0) {
        list.innerHTML = '<div class="text-center text-sm text-gray-400 py-4">Belum ada data siswa.</div>';
        return;
      }

      list.innerHTML = d.detail.map(s => {
        let badgeColor = 'bg-gray-100 text-gray-600';
        if (s.status === 'hadir') badgeColor = 'bg-green-100 text-green-700';
        if (s.status === 'sakit' || s.status === 'izin') badgeColor = 'bg-yellow-100 text-yellow-700';
        if (s.status === 'alpha') badgeColor = 'bg-red-100 text-red-700';

        return `
          <div class="flex justify-between items-center bg-gray-50 p-2 rounded border border-gray-100">
            <div>
              <div class="text-sm font-semibold text-gray-800">${s.nama}</div>
              <div class="text-[10px] text-gray-500">NISN: ${s.nisn}</div>
            </div>
            <span class="px-2 py-1 text-[10px] font-bold uppercase rounded ${badgeColor}">${s.status}</span>
          </div>
        `;
      }).join('');
    }

    // Logic Tab Siswa
    function switchTab(tab) {
      const btnG = document.getElementById('tabBtnGerbang');
      const btnM = document.getElementById('tabBtnMapel');
      const btnI = document.getElementById('tabBtnIzin');
      const listG = document.getElementById('listGerbang');
      const listM = document.getElementById('listMapel');
      const listI = document.getElementById('listIzin');

      [btnG, btnM, btnI].forEach(b => b.className = 'flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500 hover:text-gray-800 transition-all');
      [listG, listM, listI].forEach(l => l.classList.add('hidden'));

      if (tab === 'gerbang') {
        btnG.className = 'flex-1 py-2 text-sm font-semibold rounded-lg bg-white shadow text-blue-600 transition-all';
        listG.classList.remove('hidden');
      } else if (tab === 'mapel') {
        btnM.className = 'flex-1 py-2 text-sm font-semibold rounded-lg bg-white shadow text-blue-600 transition-all';
        listM.classList.remove('hidden');
      } else if (tab === 'izin') {
        btnI.className = 'flex-1 py-2 text-sm font-semibold rounded-lg bg-white shadow text-blue-600 transition-all';
        listI.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
